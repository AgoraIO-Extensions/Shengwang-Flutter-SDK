name: 'diagnose: Native SwiftPM CDN'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Compare CDN responses and fresh SwiftPM resolution
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, sys, tempfile, time
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              targets = {'video_dec': '2f8afa729f7848a8c24b9c30e59d1eb0a03eac6bbdec89909df8bd3eb7f62962', 'AgoraSoundTouch': '3a77a816493492507f7f4d11a348cff79951e1a8ee50f0a0f30b57dc56972b8f'}
              for name, expected in targets.items():
                  base = f'https://download.agora.io/swiftpm/AgoraRtcEngine_iOS/4.6.4-rc.2/{name}.xcframework.zip'
                  for mode in ['normal', 'no-cache', 'new-key']:
                      url = base + (f'?native593probe={time.time_ns()}' if mode == 'new-key' else '')
                      output, headers = root / f'{name}-{mode}.zip', root / f'{name}-{mode}.headers'
                      command = ['curl', '--fail', '--location', '--silent', '--show-error', '--connect-timeout', '10', '--max-time', '90', '--dump-header', str(headers), '--output', str(output)]
                      if mode == 'no-cache': command += ['-H', 'Cache-Control: no-cache', '-H', 'Pragma: no-cache']
                      result = subprocess.run(command + [url], capture_output=True, text=True)
                      digest = hashlib.file_digest(output.open('rb'), 'sha256').hexdigest() if result.returncode == 0 else None
                      print('CDN_PROBE ' + json.dumps({'platform': sys.platform, 'name': name, 'mode': mode, 'sha256': digest, 'expected': expected, 'matches': digest == expected, 'exit_code': result.returncode, 'headers': headers.read_text() if headers.exists() else '', 'error': result.stderr}), flush=True)
              if sys.platform == 'darwin':
                  package = root / 'package'
                  package.mkdir()
                  definitions = ','.join(f'.binaryTarget(name: "{name}", url: "https://download.agora.io/swiftpm/AgoraRtcEngine_iOS/4.6.4-rc.2/{name}.xcframework.zip", checksum: "{checksum}")' for name, checksum in targets.items())
                  manifest = '// swift-tools-version:5.9\nimport PackageDescription\nlet package = Package(name: "Native593Probe", platforms: [.iOS(.v12)], targets: [' + definitions + '])\n'
                  (package / 'Package.swift').write_text(manifest)
                  result = subprocess.run(['swift', 'package', '--package-path', str(package), '--cache-path', str(root / 'cache'), '--scratch-path', str(root / 'scratch'), 'resolve'], capture_output=True, text=True, timeout=180)
                  print('FRESH_SWIFTPM_EXIT ' + str(result.returncode), flush=True)
                  print(result.stdout + result.stderr, flush=True)
          PY
